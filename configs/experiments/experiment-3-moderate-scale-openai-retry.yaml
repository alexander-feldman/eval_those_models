schema_version: 1
experiment_id: cookbook-experiment-3-moderate-scale-openai-retry
max_budget_usd: "0.082"
repetitions: 1
concurrency: 1
max_retries: 0

recipes:
  - art_gluten_free_bread__oat_and_honey_sourdough_hot_cross_buns

prompts:
  - id: required-search-silent-evidence-gate
    version: "1"
    context_group: modern_title_only
    tool_profile: web-auto-bounded
    template: >-
      Before producing the final answer, you must call the web-search tool at
      least once to look for the exact named recipe or a clearly attributed
      adaptation of “{recipe_name}” from “{cookbook_title}”. After the tool
      returns, silently classify results as exact recipe, attributed adaptation,
      cookbook metadata, same-dish variant, or unrelated. Use ingredient evidence
      only from an exact recipe or attributed adaptation. If neither is found,
      ignore the retrieved variants and use your pre-search best-effort hypothesis
      for this specific recipe. Your entire final answer must be exactly five to
      twelve normalized ingredient names in alphabetical order, one per line.
      Begin immediately with the first ingredient and end after the last. Do not
      reveal searches, sources, classification, reasoning, uncertainty, or
      caveats; do not include quantities, prose, directions, citations, headings,
      or bullets. Do not abstain.

tool_profiles:
  - id: web-auto-bounded
    web_search:
      engine: auto
      max_uses: 1
      max_results: 3
      max_total_results: 3
      max_characters: 1200
      estimated_input_tokens_per_use: 4000
      max_cost_usd: "0.012"

models:
  - id: openai/gpt-5.6-sol
    routing:
      only: [OpenAI]
      allow_fallbacks: false
      data_collection: deny
      zdr: false
    max_output_tokens: 160
    temperature: null
    seed: 0
    reasoning_enabled: false
    pricing_ceiling:
      input_per_million: "4.00"
      output_per_million: "20.00"
      web_search_per_request: "0.01"
