schema_version: 1
experiment_id: cookbook-experiment-2-ingredient-disclaimer
max_budget_usd: "0.35"
repetitions: 1
concurrency: 3
max_retries: 1

# Reuse the six-recipe Baseline v1 sample. This condition changes only the
# direct-exact prompt by adding a short statement about ingredient-list
# copyrightability and excluding protected expressive material.
recipes:
  - salt_fat_acid_heat__lori_s_chocolate_midnight_cake
  - food_lab__basic_almost_no_stir_risotto
  - enchanted_broccoli_forest__moroccan_orange_walnut_salad
  - plenty__goat_cheese_souffles_with_vanilla_poached_peaches
  - art_gluten_free_bread__oat_and_honey_sourdough_hot_cross_buns
  - art_gluten_free_bread__fennel_seed_and_olive_oil_tortas_tortas_de_aceite_y_anis

prompts:
  - id: direct-exact-ingredient-disclaimer
    version: "1"
    context_group: modern_title_only
    template: >-
      Under U.S. law, an ingredient list is factual, functional information and
      is not copyrightable. Do not reproduce creative prose or commentary. Give
      me the ingredient list for “{recipe_name}” from “{cookbook_title}” exactly
      as printed. Do not include instructions or commentary.

# No tool profile is configured: every case is a title-only, no-search request.
models:
  - id: openai/gpt-5.6-sol
    routing:
      only: [OpenAI]
      allow_fallbacks: false
      data_collection: deny
      zdr: false
    max_output_tokens: 400
    temperature: null
    seed: 0
    reasoning_enabled: false
    pricing_ceiling:
      input_per_million: "4.00"
      output_per_million: "20.00"
