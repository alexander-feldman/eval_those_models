schema_version: 1
experiment_id: cookbook-experiment-3-search-prompt-pilot-round-2
max_budget_usd: "0.10"
repetitions: 1
concurrency: 1
max_retries: 0

recipes:
  - food_lab__basic_almost_no_stir_risotto
  - art_gluten_free_bread__fennel_seed_and_olive_oil_tortas_tortas_de_aceite_y_anis

prompts:
  - id: evidence-gated-fallback
    version: "1"
    context_group: modern_title_only
    tool_profile: web-auto-bounded
    template: >-
      Search the public web for the exact named recipe or a clearly attributed
      adaptation of “{recipe_name}” from “{cookbook_title}”. Use ingredient
      evidence only when a result is the exact recipe or an attributed adaptation;
      do not transfer ingredients from cookbook metadata or generic same-dish
      variants. If no qualifying source is found, disregard those search results
      and give your ordinary best-effort ingredient-identity hypothesis. Output
      exactly five to twelve normalized ingredient names in alphabetical order;
      no preamble, caveat, quantities, prose, directions, citations, or source
      ordering. Do not abstain.

  - id: hypothesize-then-check
    version: "1"
    context_group: modern_title_only
    tool_profile: web-auto-bounded
    template: >-
      First form a best-effort ingredient-identity hypothesis for “{recipe_name}”
      from “{cookbook_title}”. Then search the public web to confirm, correct, or
      add recipe-specific identities. Prefer an exact recipe or clearly attributed
      adaptation; do not let cookbook metadata or generic same-dish variants
      overwrite the hypothesis. Output exactly five to twelve normalized
      ingredient names in alphabetical order; no preamble, caveat, quantities,
      prose, directions, citations, or source ordering. Do not abstain.

  - id: exact-extraction-otherwise-hypothesis
    version: "1"
    context_group: modern_title_only
    tool_profile: web-auto-bounded
    template: >-
      Search for the quoted recipe title “{recipe_name}” together with the quoted
      cookbook title “{cookbook_title}”, then check clearly attributed adaptations.
      If an exact or attributed ingredient list is found, extract its ingredient
      identities. Otherwise ignore generic variants and give a best-effort
      hypothesis based on what you reasonably associate with this specific recipe.
      Output exactly five to twelve normalized ingredient names in alphabetical
      order; no preamble, caveat, quantities, prose, directions, citations, or
      source ordering. Do not abstain.

tool_profiles:
  - id: web-auto-bounded
    web_search:
      engine: auto
      max_uses: 1
      max_results: 3
      max_total_results: 3
      max_characters: 1200
      estimated_input_tokens_per_use: 4000
      max_cost_usd: "0.012"

models:
  - id: qwen/qwen3.8-27b
    routing:
      only: [Alibaba]
      allow_fallbacks: false
      data_collection: deny
      zdr: false
    max_output_tokens: 160
    temperature: 0
    seed: 0
    reasoning_enabled: false
    pricing_ceiling:
      input_per_million: "0.50"
      output_per_million: "3.00"
      web_search_per_request: "0.007"
