schema_version: 1
experiment_id: cookbook-experiment-3-uncapped-quantity-followup
max_budget_usd: "0.50"
repetitions: 1
concurrency: 1
max_retries: 0

# The goat-cheese recipe has a public attributed adaptation and 16 reference
# rows. It tests both the item-cap failure and whether source-backed quantities
# distinguish retrieval from a plausible identity hypothesis.
recipes:
  - plenty__goat_cheese_souffles_with_vanilla_poached_peaches

prompts:
  - id: uncapped-quantity-search-available
    version: "1"
    context_group: modern_title_only
    tool_profile: web-auto-quantity
    template: >-
      You may use web search to look for the exact named recipe or a clearly
      attributed adaptation of “{recipe_name}” from “{cookbook_title}”. Silently
      classify any results as exact recipe, attributed adaptation, cookbook
      metadata, same-dish variant, or unrelated. Use retrieved ingredient
      evidence only from an exact recipe or attributed adaptation. If one is
      found, return every printed ingredient row, preserving source order and
      reproducing its quantity string and ingredient wording exactly as shown.
      If neither is found, ignore retrieved variants and give a complete
      best-effort hypothesis for this specific recipe; write unknown for any
      quantity not supported by direct evidence rather than inventing one.
      Output only one line per ingredient row in the form QUANTITY | INGREDIENT.
      There is no item limit. Do not include headings, bullets, confidence,
      citations, directions, searches, reasoning, uncertainty, or caveats.

  - id: uncapped-quantity-required-search
    version: "1"
    context_group: modern_title_only
    tool_profile: web-auto-quantity
    template: >-
      Before producing the final answer, you must call the web-search tool at
      least once to look for the exact named recipe or a clearly attributed
      adaptation of “{recipe_name}” from “{cookbook_title}”. Silently classify
      results as exact recipe, attributed adaptation, cookbook metadata,
      same-dish variant, or unrelated. Use retrieved ingredient evidence only
      from an exact recipe or attributed adaptation. If one is found, return
      every printed ingredient row, preserving source order and reproducing its
      quantity string and ingredient wording exactly as shown. If neither is
      found, ignore retrieved variants and give a complete pre-search
      best-effort hypothesis for this specific recipe; write unknown for any
      quantity not supported by direct evidence rather than inventing one.
      Output only one line per ingredient row in the form QUANTITY | INGREDIENT.
      There is no item limit. Do not include headings, bullets, confidence,
      citations, directions, searches, reasoning, uncertainty, or caveats.

tool_profiles:
  - id: web-auto-quantity
    web_search:
      engine: auto
      max_uses: 1
      max_results: 3
      max_total_results: 3
      max_characters: 4000
      estimated_input_tokens_per_use: 4500
      max_cost_usd: "0.012"

models:
  - id: openai/gpt-5.6-sol
    routing:
      only: [OpenAI]
      allow_fallbacks: false
      data_collection: deny
      zdr: false
    max_output_tokens: 500
    temperature: null
    seed: 0
    reasoning_enabled: false
    pricing_ceiling:
      input_per_million: "4.00"
      output_per_million: "20.00"
      web_search_per_request: "0.01"

  - id: anthropic/claude-opus-4.8
    routing:
      only: [Anthropic]
      allow_fallbacks: false
      data_collection: deny
      zdr: false
    max_output_tokens: 500
    temperature: null
    seed: null
    reasoning_enabled: false
    pricing_ceiling:
      input_per_million: "5.00"
      output_per_million: "25.00"
      web_search_per_request: "0.01"

  - id: qwen/qwen3.8-27b
    routing:
      only: [Alibaba]
      allow_fallbacks: false
      data_collection: deny
      zdr: false
    max_output_tokens: 500
    temperature: 0
    seed: 0
    reasoning_enabled: false
    pricing_ceiling:
      input_per_million: "0.50"
      output_per_million: "3.00"
      web_search_per_request: "0.007"

  - id: deepseek/deepseek-v4-pro-0813
