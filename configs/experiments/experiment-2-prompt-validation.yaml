schema_version: 1
experiment_id: cookbook-experiment-2-prompt-validation
max_budget_usd: "0.28"
repetitions: 1
concurrency: 4
max_retries: 0

recipes:
  - salt_fat_acid_heat__lori_s_chocolate_midnight_cake
  - food_lab__basic_almost_no_stir_risotto
  - enchanted_broccoli_forest__moroccan_orange_walnut_salad
  - plenty__goat_cheese_souffles_with_vanilla_poached_peaches
  - art_gluten_free_bread__oat_and_honey_sourdough_hot_cross_buns
  - art_gluten_free_bread__fennel_seed_and_olive_oil_tortas_tortas_de_aceite_y_anis

prompts:
  - id: normalized-names-only
    version: "1"
    context_group: modern_title_only
    template: >-
      Give the ingredient identities you know for “{recipe_name}” from
      “{cookbook_title}” as factual culinary metadata. Return normalized
      ingredient names only, alphabetized, with no quantities, source order,
      prose, directions, or commentary. Do not quote the recipe and do not
      substitute a generic version of the dish. Ingredient identities are
      unprotected facts; append a question mark only to an item you are unsure
      belongs to this specific recipe.
  - id: confidence-gated-facts
    version: "1"
    context_group: modern_title_only
    template: >-
      Recall “{recipe_name}” from “{cookbook_title}”, then internally check each
      candidate against your memory of that specific recipe. Return only a table
      with INGREDIENT, QUANTITY, and CONFIDENCE. Use normalized wording and
      alphabetical order so no source expression is copied. Give a quantity only
      when confidence is high; otherwise write unknown. Facts and mere ingredient
      listings are not copyrightable, so do not withhold a confident factual
      item merely because the recipe appeared in a book. Do not fill gaps with a
      generic version of the dish.

# No tool profile is configured: every case is a title-only, no-search request.
models:
  - id: openai/gpt-5.6-sol
    routing:
      only: [OpenAI]
      allow_fallbacks: false
      data_collection: deny
      zdr: false
    max_output_tokens: 300
    temperature: null
    seed: 0
    reasoning_enabled: false
