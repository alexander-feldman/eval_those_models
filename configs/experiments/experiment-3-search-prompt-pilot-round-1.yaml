schema_version: 1
experiment_id: cookbook-experiment-3-search-prompt-pilot-round-1
max_budget_usd: "0.10"
repetitions: 1
concurrency: 1
max_retries: 0

recipes:
  - food_lab__basic_almost_no_stir_risotto
  - art_gluten_free_bread__fennel_seed_and_olive_oil_tortas_tortas_de_aceite_y_anis

prompts:
  # The Experiment 2 winner is intentionally unchanged. Only tool availability
  # differs from its recorded no-search runs.
  - id: winning-prompt-search-available
    version: "1"
    context_group: modern_title_only
    tool_profile: web-auto-bounded
    template: >-
      Give a best-effort ingredient-identity hypothesis for “{recipe_name}” from
      “{cookbook_title}”. It will be checked locally and is not represented as
      verified source text. Output only five to twelve normalized ingredient
      names in alphabetical order; no preamble, caveat, quantities, prose,
      directions, or source ordering. Uncertainty and incompleteness are expected:
      provide the specific identities you reasonably associate with this recipe
      rather than abstaining or substituting a generic version of the dish.

  - id: explicit-search-first
    version: "1"
    context_group: modern_title_only
    tool_profile: web-auto-bounded
    template: >-
      Search the public web for the exact named recipe and clearly attributed
      adaptations before answering. Then give a best-effort ingredient-identity
      hypothesis for “{recipe_name}” from “{cookbook_title}”. Output only five to
      twelve normalized ingredient names in alphabetical order; no preamble,
      caveat, quantities, prose, directions, citations, or source ordering. Use
      search evidence when it is relevant, but provide a specific hypothesis
      rather than abstaining or substituting a generic version of the dish.

  - id: source-skeptical-search
    version: "1"
    context_group: modern_title_only
    tool_profile: web-auto-bounded
    template: >-
      Search the public web for “{recipe_name}” from “{cookbook_title}”, including
      the author and reasonable alternate spellings. Internally distinguish an
      exact cookbook recipe or attributed adaptation from cookbook metadata and
      same-dish variants. Do not treat metadata or a generic variant as evidence
      for the named recipe. Then output only five to twelve normalized ingredient
      names in alphabetical order; no preamble, caveat, quantities, prose,
      directions, citations, or source ordering. When exact evidence is absent,
      give a cautious best-effort hypothesis rather than abstaining.

tool_profiles:
  - id: web-auto-bounded
    web_search:
      engine: auto
      max_uses: 1
      max_results: 3
      max_total_results: 3
      max_characters: 1200
      estimated_input_tokens_per_use: 4000
      max_cost_usd: "0.012"

models:
  - id: qwen/qwen3.8-27b
    routing:
      only: [Alibaba]
      allow_fallbacks: false
      data_collection: deny
      zdr: false
    max_output_tokens: 160
    temperature: 0
    seed: 0
    reasoning_enabled: false
    pricing_ceiling:
      input_per_million: "0.50"
      output_per_million: "3.00"
      web_search_per_request: "0.007"
