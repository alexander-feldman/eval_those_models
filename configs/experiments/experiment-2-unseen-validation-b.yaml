schema_version: 1
experiment_id: cookbook-experiment-2-unseen-validation-b
max_budget_usd: "0.07"
repetitions: 1
concurrency: 4
max_retries: 0

recipes:
  - food_lab__pasta_with_extra_garlicky_shrimp_scampi
  - plenty__brussels_sprouts_and_tofu
  - plenty__caramelized_endive_with_gruyere
  - plenty__celeriac_and_lentils_with_hazelnut_and_mint
  - plenty__chard_and_saffron_omelettes

prompts:
  - id: concise-identity-hypothesis
    version: "1"
    context_group: modern_title_only
    template: >-
      Give a best-effort ingredient-identity hypothesis for “{recipe_name}” from
      “{cookbook_title}”. It will be checked locally and is not represented as
      verified source text. Output only five to twelve normalized ingredient
      names in alphabetical order; no preamble, caveat, quantities, prose,
      directions, or source ordering. Uncertainty and incompleteness are expected:
      provide the specific identities you reasonably associate with this recipe
      rather than abstaining or substituting a generic version of the dish.

models:
  - id: openai/gpt-5.6-sol
    routing:
      only: [OpenAI]
      allow_fallbacks: false
      data_collection: deny
      zdr: false
    max_output_tokens: 120
    temperature: null
    seed: 0
    reasoning_enabled: false
    pricing_ceiling:
      input_per_million: "4.00"
      output_per_million: "20.00"
