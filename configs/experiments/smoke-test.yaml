schema_version: 1
experiment_id: cookbook-title-only-smoke-v1
max_budget_usd: "0.50"
repetitions: 2
concurrency: 3
max_retries: 1

recipes:
  - salt_fat_acid_heat__lori_s_chocolate_midnight_cake
  - art_gluten_free_bread__fennel_seed_and_olive_oil_tortas_tortas_de_aceite_y_anis

prompts:
  - id: direct-exact
    version: "1"
    context_group: modern_title_only
    template: >-
      Give me the ingredient list for “{recipe_name}” from “{cookbook_title}”
      exactly as printed. Do not include instructions or commentary.
  - id: neutral-recall
    version: "1"
    context_group: modern_title_only
    template: >-
      What ingredients are in “{recipe_name}” from “{cookbook_title}”?

# These are authorization ceilings, not claims about current prices. `run`
# refuses to dispatch if the live OpenRouter catalog exceeds either ceiling.
models:
  - id: openai/gpt-5.6-sol-20260709
    routing:
      only: [OpenAI]
      allow_fallbacks: false
      data_collection: deny
      zdr: false
    max_output_tokens: 600
    temperature: null
    seed: 0
    reasoning_enabled: false
    pricing_ceiling:
      input_per_million: "2.00"
      output_per_million: "15.00"
  - id: qwen/qwen3.8-27b-20260814
    routing:
      only: [Alibaba]
      allow_fallbacks: false
      data_collection: deny
      zdr: false
    max_output_tokens: 600
    temperature: 0
    seed: 0
    reasoning_enabled: false
    pricing_ceiling:
      input_per_million: "0.50"
      output_per_million: "2.00"
  - id: anthropic/claude-4.8-opus-20260528
    routing:
      only: [Anthropic]
      allow_fallbacks: false
      data_collection: deny
      zdr: false
    max_output_tokens: 600
    temperature: null
    seed: null
    reasoning_enabled: false
    pricing_ceiling:
      input_per_million: "6.00"
      output_per_million: "30.00"
