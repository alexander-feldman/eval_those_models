[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-those-models"
version = "0.1.0"
description = "A reproducible harness for evaluating model behavior and response quality."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml>=6.0,<7",
]

[project.scripts]
eval-those-models = "eval_those_models.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eval_those_models"]

[tool.hatch.build.targets.wheel.force-include]
"src/eval_those_models/dataset/schema.sql" = "eval_those_models/dataset/schema.sql"

[tool.pytest.ini_options]
addopts = "--cov=eval_those_models --cov-report=term-missing --strict-markers"
testpaths = ["tests"]
markers = [
  "live: requires credentials and may contact a paid provider",
]

[tool.coverage.run]
branch = true
source = ["eval_those_models"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  '\.\.\.',
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
